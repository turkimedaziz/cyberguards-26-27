version: "3.8"

services:
  cyberguards-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberguards-website
    ports:
      - "8080:80" # Changed to 8080 to avoid conflict with Nginx Proxy Manager
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - proxy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy:
    external: false
